set -g set-titles on
set -g set-titles-string "#{session_name}:#{window_name}"

# Responsiveness over mosh (mosht). mosh's frame prediction fragments escape
# sequences; tmux's default 500ms escape-time then mis-parses them, so
# full-screen prompts (e.g. Claude Code / MCP approval modals) appear frozen
# and swallow keystrokes until you mash Escape. A short escape-time fixes it.
set -sg escape-time 10
set -g focus-events on
